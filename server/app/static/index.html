<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deskbot</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<section id="login-screen" class="hidden">
  <form class="login-card" id="login-form">
    <div class="logotype">DESKBOT</div>
    <p>Enter the desk password to continue.</p>
    <input type="password" id="login-password" name="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Unlock</button>
    <div class="login-error" id="login-error"></div>
  </form>
</section>

<div id="app" class="hidden">
  <header class="top">
    <div>
      <div class="logotype">DESKBOT</div>
      <div class="tagline">Search, queue, and keep a list &mdash; your desk unit reads it live.</div>
    </div>
    <a href="#" class="logout-link" id="logout-link">Log out</a>
  </header>

  <main class="col-main">
    <section class="panel">
      <h2>Search YouTube</h2>
      <form class="search-row" id="search-form">
        <input type="text" id="search-input" placeholder="Search YouTube…" autocomplete="off">
        <button type="submit">Search</button>
      </form>
    </section>

    <section class="panel">
      <h2>Now playing</h2>
      <div class="now-playing-row">
        <span class="status-pill" id="now-status" data-status="idle">Idle</span>
        <span class="now-playing-title muted" id="now-title">Nothing queued</span>
      </div>
    </section>

    <section class="panel">
      <h2>Results</h2>
      <div id="results">
        <div class="empty-note">Search for something to play on your desk unit.</div>
      </div>
    </section>
  </main>

  <aside class="desk-unit">
    <div class="screen">
      <div class="orb o1"></div>
      <div class="orb o2"></div>
      <div class="orb o3"></div>
      <div class="screen-content">
        <div class="clock" id="clock">--:--:--</div>
        <div class="date" id="date">-</div>
        <div class="desk-status" id="desk-status">no tasks pending</div>
      </div>
    </div>
    <div class="desk-label">To-do</div>
    <div class="todo-panel">
      <form class="todo-add" id="todo-form">
        <input type="text" id="todo-input" placeholder="Add a task…" autocomplete="off">
        <button type="submit">+</button>
      </form>
      <ul id="todo-list"></ul>
    </div>
  </aside>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
